<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>
text { font-family: Arial, sans-serif; fill:#111; }
.w { stroke:#111; stroke-width:2; fill:none; }
.thin { stroke:#111; stroke-width:1.4; fill:none; }
.box { stroke:#111; stroke-width:2; fill:#fff; }
.title { font-size:26px; font-weight:bold; }
.h { font-size:18px; font-weight:bold; }
.t { font-size:15px; }
.s { font-size:13px; }
.net { font-size:14px; font-weight:bold; }
</style>

<text x="45" y="45" class="title">ESP-CellCore USB Interlock Rev A — schematic concept</text>
<text x="45" y="72" class="t">Four-pole normally-open relay isolation. Standard single-line POTS on RJ11 center pair reaches only open relay contacts.</text>

<!-- RJ11 -->
<rect x="45" y="135" width="190" height="250" class="box"/>
<text x="140" y="165" text-anchor="middle" class="h">J1 — 4P4C RJ11</text>
<text x="62" y="205" class="t">1  USB_VBUS_IN</text>
<text x="62" y="250" class="t">2  USB_D−_IN</text>
<text x="62" y="295" class="t">3  USB_D+_IN</text>
<text x="62" y="340" class="t">4  USB_GND_IN</text>
<text x="62" y="370" class="s">Pins 2/3 = normal POTS center pair</text>

<!-- Relay boxes -->
<rect x="410" y="175" width="250" height="180" class="box"/>
<text x="535" y="202" text-anchor="middle" class="h">K1 — HFD4/5-SR</text>
<text x="535" y="226" text-anchor="middle" class="s">DPDT, 5 V, C64399</text>

<rect x="775" y="175" width="250" height="180" class="box"/>
<text x="900" y="202" text-anchor="middle" class="h">K2 — HFD4/5-SR</text>
<text x="900" y="226" text-anchor="middle" class="s">DPDT, 5 V, C64399</text>

<!-- Data paths -->
<line x1="235" y1="245" x2="410" y2="245" class="w"/>
<line x1="660" y1="245" x2="1140" y2="245" class="w"/>
<text x="300" y="236" class="net">D−</text>
<text x="688" y="236" class="net">D− OUT</text>

<line x1="235" y1="290" x2="410" y2="290" class="w"/>
<line x1="660" y1="290" x2="1140" y2="290" class="w"/>
<text x="300" y="281" class="net">D+</text>
<text x="688" y="281" class="net">D+ OUT</text>

<!-- Power paths -->
<line x1="235" y1="200" x2="775" y2="200" class="w"/>
<line x1="1025" y1="200" x2="1140" y2="200" class="w"/>
<text x="300" y="191" class="net">VBUS IN</text>
<text x="1045" y="191" class="net">VBUS OUT</text>

<line x1="235" y1="335" x2="775" y2="335" class="w"/>
<line x1="1025" y1="335" x2="1140" y2="335" class="w"/>
<text x="300" y="326" class="net">GND IN</text>
<text x="1045" y="326" class="net">GND OUT</text>

<!-- NO indication -->
<text x="535" y="332" text-anchor="middle" class="s">Use COM→NO only; NC unused</text>
<text x="900" y="332" text-anchor="middle" class="s">Use COM→NO only; NC unused</text>

<!-- USB output -->
<rect x="1140" y="155" width="210" height="220" class="box"/>
<text x="1245" y="185" text-anchor="middle" class="h">J2 — to LilyGO USB</text>
<text x="1160" y="220" class="t">1  +5 V / VBUS</text>
<text x="1160" y="260" class="t">2  D−</text>
<text x="1160" y="300" class="t">3  D+</text>
<text x="1160" y="340" class="t">4  GND</text>

<!-- enable circuit -->
<text x="45" y="465" class="h">Relay enable / over-voltage inhibit</text>

<!-- VBUS feed -->
<line x1="95" y1="515" x2="250" y2="515" class="w"/>
<text x="45" y="520" class="net">VBUS IN</text>
<text x="145" y="505" class="s">R1 220 kΩ</text>
<rect x="250" y="501" width="75" height="28" class="box"/>
<text x="287" y="521" text-anchor="middle" class="s">220k</text>
<line x1="325" y1="515" x2="390" y2="515" class="w"/>
<circle cx="390" cy="515" r="5" fill="#111"/>
<text x="398" y="505" class="net">EN</text>

<!-- C1 -->
<line x1="390" y1="515" x2="390" y2="570" class="w"/>
<line x1="365" y1="570" x2="415" y2="570" class="w"/>
<line x1="365" y1="580" x2="415" y2="580" class="w"/>
<line x1="390" y1="580" x2="390" y2="620" class="w"/>
<text x="423" y="578" class="t">C1 100 nF</text>

<!-- Q1 -->
<rect x="475" y="485" width="150" height="80" class="box"/>
<text x="550" y="510" text-anchor="middle" class="h">Q1 MMBTA42</text>
<text x="550" y="535" text-anchor="middle" class="s">NPN, 300 V</text>
<text x="550" y="555" text-anchor="middle" class="s">C2858524</text>
<line x1="390" y1="515" x2="475" y2="515" class="w"/>
<line x1="550" y1="565" x2="550" y2="620" class="w"/>

<!-- QP -->
<rect x="690" y="475" width="175" height="100" class="box"/>
<text x="778" y="500" text-anchor="middle" class="h">Q3 MMBTA92</text>
<text x="778" y="525" text-anchor="middle" class="s">PNP high-side, 300 V</text>
<text x="778" y="545" text-anchor="middle" class="s">C909761</text>
<text x="778" y="565" text-anchor="middle" class="s">E=VBUS, C=COIL+</text>
<line x1="625" y1="515" x2="650" y2="515" class="w"/>
<rect x="650" y="501" width="40" height="28" class="box"/>
<text x="670" y="521" text-anchor="middle" class="s">4k7</text>
<line x1="865" y1="515" x2="925" y2="515" class="w"/>
<text x="647" y="492" class="s">R2</text>

<!-- base-emitter pullup -->
<line x1="750" y1="475" x2="750" y2="435" class="w"/>
<rect x="735" y="402" width="30" height="33" class="box"/>
<text x="775" y="424" class="s">R3 100k</text>
<line x1="750" y1="402" x2="750" y2="385" class="w"/>
<line x1="750" y1="385" x2="610" y2="385" class="w"/>
<text x="540" y="390" class="net">VBUS IN</text>
<line x1="610" y1="385" x2="610" y2="475" class="w"/>

<!-- OVP detector -->
<text x="45" y="680" class="h">OVP clamp: turns Q1 off above ≈5.8–6.0 V</text>
<line x1="95" y1="730" x2="180" y2="730" class="w"/>
<text x="45" y="735" class="net">VBUS IN</text>
<rect x="180" y="716" width="75" height="28" class="box"/>
<text x="217" y="736" text-anchor="middle" class="s">100k</text>
<rect x="270" y="716" width="75" height="28" class="box"/>
<text x="307" y="736" text-anchor="middle" class="s">100k</text>
<line x1="255" y1="730" x2="270" y2="730" class="w"/>
<line x1="345" y1="730" x2="390" y2="730" class="w"/>
<text x="185" y="708" class="s">R4</text>
<text x="275" y="708" class="s">R5</text>

<!-- zener -->
<polygon points="390,716 410,730 390,744" fill="none" stroke="#111" stroke-width="2"/>
<line x1="414" y1="714" x2="414" y2="746" class="w"/>
<line x1="414" y1="730" x2="465" y2="730" class="w"/>
<text x="388" y="765" class="t">D1 5.1 V Zener</text>

<rect x="465" y="690" width="155" height="80" class="box"/>
<text x="542" y="715" text-anchor="middle" class="h">Q2 MMBTA42</text>
<text x="542" y="740" text-anchor="middle" class="s">NPN OVP clamp</text>
<text x="542" y="760" text-anchor="middle" class="s">C2858524</text>
<line x1="542" y1="770" x2="542" y2="810" class="w"/>
<line x1="620" y1="730" x2="680" y2="730" class="w"/>
<line x1="680" y1="730" x2="680" y2="515" class="w"/>
<line x1="680" y1="515" x2="390" y2="515" class="thin"/>
<text x="690" y="718" class="s">collector clamps EN</text>

<!-- relay coil branch -->
<text x="940" y="455" class="h">Relay coils (parallel)</text>
<line x1="925" y1="515" x2="980" y2="515" class="w"/>
<rect x="980" y="501" width="90" height="28" class="box"/>
<text x="1025" y="521" text-anchor="middle" class="s">F1 100mA</text>
<text x="982" y="492" class="s">60 V PPTC C46641037</text>
<line x1="1070" y1="515" x2="1110" y2="515" class="w"/>
<circle cx="1110" cy="515" r="5" fill="#111"/>

<line x1="1110" y1="515" x2="1110" y2="555" class="w"/>
<rect x="1130" y="535" width="95" height="45" class="box"/>
<text x="1177" y="554" text-anchor="middle" class="s">K1 coil 178 Ω</text>
<text x="1177" y="572" text-anchor="middle" class="s">5 V</text>
<line x1="1110" y1="555" x2="1130" y2="555" class="w"/>
<line x1="1225" y1="555" x2="1245" y2="555" class="w"/>
<line x1="1245" y1="555" x2="1245" y2="620" class="w"/>

<line x1="1110" y1="515" x2="1110" y2="600" class="thin"/>
<rect x="1130" y="585" width="95" height="45" class="box"/>
<text x="1177" y="604" text-anchor="middle" class="s">K2 coil 178 Ω</text>
<text x="1177" y="622" text-anchor="middle" class="s">5 V</text>
<line x1="1110" y1="605" x2="1130" y2="605" class="w"/>
<line x1="1225" y1="605" x2="1245" y2="605" class="w"/>
<line x1="1245" y1="605" x2="1245" y2="620" class="w"/>

<!-- flyback diodes -->
<line x1="1265" y1="515" x2="1265" y2="620" class="thin"/>
<polygon points="1255,545 1265,565 1275,545" fill="none" stroke="#111" stroke-width="2"/>
<line x1="1252" y1="570" x2="1278" y2="570" class="w"/>
<text x="1285" y="563" class="s">D2/D3 flyback</text>
<text x="1285" y="580" class="s">one per coil</text>
<!-- grounds -->
<line x1="60" y1="620" x2="1335" y2="620" class="w"/>
<text x="45" y="625" class="net">GND IN</text>
<line x1="50" y1="810" x2="650" y2="810" class="w"/>
<line x1="390" y1="620" x2="390" y2="810" class="thin"/>
<line x1="550" y1="620" x2="550" y2="810" class="thin"/>

<!-- notes -->
<rect x="760" y="665" width="590" height="175" class="box"/>
<text x="780" y="692" class="h">Design notes</text>
<text x="780" y="720" class="t">• Q1 turn-on is delayed by R1/C1; Q2 clamps EN before relays can pull in on over-voltage.</text>
<text x="780" y="748" class="t">• D1 ≈5.1 V + Q2 VBE gives ~5.8–6.0 V inhibit threshold.</text>
<text x="780" y="776" class="t">• F1 is backup only; 60 V rating is not telecom surge certification.</text>
<text x="780" y="804" class="t">• Layout: keep RJ11-side copper ≥2 mm from LilyGO-side USB nets around relay isolation gap.</text>
<text x="780" y="832" class="t">• Validate on bench at 5 V and with a current-limited 48 V source before connecting the LilyGO.</text>
</svg>