name: Publish illustrated build guide

on:
  push:
    branches:
      - main
    paths:
      - guide/**
      - .github/workflows/guide-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: guide/requirements.txt

      - name: Install guide dependencies
        run: python -m pip install -r guide/requirements.txt

      - name: Build guide
        run: python -m mkdocs build --strict -f guide/mkdocs.yml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload guide
        uses: actions/upload-pages-artifact@v4
        with:
          path: guide/site-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
